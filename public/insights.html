<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insights | Camaze</title>
  <script src="/theme-init.js"></script>
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/insights.css">
</head>
<body>
  <header id="app-header"></header><script src="/header.js"></script>
  <main>
    <div class="insights-heading"><div><h1>Insights</h1><p class="muted">Model candidates worth evaluating</p></div>
      <fieldset class="view-switch"><legend class="sr-only">Insights data</legend>
        <label><input type="radio" name="view" value="real" checked> Your usage</label>
        <label><input type="radio" name="view" value="sample"> Sample examples</label>
      </fieldset>
    </div>
    <div id="status" role="status" aria-live="polite">Loading recorded usage...</div>
    <p id="period" class="muted"></p>
    <section id="insights" aria-label="Model comparisons"></section>
    <section id="coverage" aria-label="Comparison coverage"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/insights.js"></script>
</body>
</html>
