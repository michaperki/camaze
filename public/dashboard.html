<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/theme-init.js"></script>
<script src="/simulation.js"></script>
<link rel="stylesheet" href="/simulation.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>camaze — how much is that?!</title>
<link rel="stylesheet" href="/shared.css">
<style>
  /* Dashboard's own top padding is a bit more generous than the other
     app pages' (shared main{} default) — kept as the one thing that
     still varies here. */
  main { padding-top: 32px; }
  #month-selector {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 6px;
  }
  #month-selector button {
    font: inherit;
    font-size: 13px;
    color: var(--text-secondary);
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 3px 9px;
    cursor: pointer;
    line-height: 1.4;
  }
  #month-selector button:hover:not(:disabled) { color: var(--text-primary); border-color: var(--text-muted); }
  #month-selector button:disabled { opacity: 0.4; cursor: default; }
  #month-label { font-size: 14px; font-weight: 600; min-width: 9em; text-align: center; }
  @media (max-width: 700px) {
    #summary-row { grid-template-columns: 1fr; }
  }
  /* Stage-1 preview of the extracted micro-label convention (10px,
     uppercase, tracked) — scoped to dashboard.html only for now; see
     .label-micro in shared.css for the shared definition it mirrors. */
  .stat-label {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
  }
  .chart-total-amount { color: var(--text-primary); font-weight: 600; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .stat-meta { font-size: 12px; color: var(--text-muted); margin: 0 0 8px; }
  .notes { margin: 0 0 12px; }
  .note { font-size: 13px; color: var(--text-secondary); padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; }
  .message a { color: var(--accent); }
  /* The chart and breakdown cards live in a 2-column grid (dense layout
     on wide screens); the grid's own `gap` supplies the spacing between
     them, both as a column gap side-by-side and, once collapsed to a
     single column below 1100px, as the row gap between the stacked cards
     — so neither card needs its own margin-top. */
  .dashboard-grid {
    display: grid;
    grid-template-columns: 3fr 2fr;
    align-items: start;
    gap: 16px;
  }
  @media (max-width: 1100px) {
    .dashboard-grid { grid-template-columns: 1fr; }
  }
  .breakdown-tabs {
    display: flex;
    gap: 16px;
    margin: 0 0 16px;
    border-bottom: 1px solid var(--border);
  }
  .breakdown-tab {
    font: inherit;
    font-size: 13px;
    color: var(--text-secondary);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 0 0 8px;
    margin: 0;
    cursor: pointer;
  }
  .breakdown-tab:hover { color: var(--text-primary); }
  .breakdown-tab.active {
    color: var(--text-primary);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }
  /* Both panes are stacked in the same grid cell instead of toggled with
     display:none, so the grid row's auto height is the taller of the two —
     switching tabs can't resize the card, and the shorter tab just leaves
     whitespace. Each pane also caps its own height and scrolls internally
     if its content genuinely exceeds that, rather than growing the row
     (and the card) without bound. */
  .breakdown-body { display: grid; grid-template-columns: 1fr; }
  .breakdown-body > div {
    grid-area: 1 / 1;
    min-height: 0;
    max-height: 360px;
    overflow-y: auto;
  }
  .breakdown-body > .pane-hidden { visibility: hidden; pointer-events: none; }
  #subscriptions-card { margin-top: 16px; }
  #subscriptions-card > summary {
    cursor: pointer;
  }
  #subscriptions-card > summary::marker { color: var(--text-muted); }
  .subscriptions-total { color: var(--text-primary); font-weight: 600; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .subscription-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    font-size: 13px;
    margin-top: 10px;
  }
  .subscription-row:first-of-type { margin-top: 12px; }
  .subscription-name { color: var(--text-secondary); }
  .subscription-amount { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
  .model-row {
    display: grid;
    grid-template-columns: minmax(0, 180px) 1fr auto;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
  }
  .model-row:first-of-type { margin-top: 12px; }
  .model-label {
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: right;
  }
  .model-bar-track { border-radius: 3px; height: 14px; }
  .model-bar { height: 100%; border-radius: 3px; min-width: 3px; }
  .model-stats { display: flex; align-items: baseline; justify-content: flex-end; gap: 8px; }
  .model-pct {
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    min-width: 30px;
    text-align: right;
  }
  .model-amount {
    font-size: 13px;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--text-secondary);
    text-align: right;
  }
  .section-footnote {
    font-size: 12px;
    color: var(--text-muted);
    margin: 14px 0 0;
  }
  .section-footnote-warning { color: var(--warning); }
  /* Reconciliation drift (see lib/reconcile.js) — deliberately louder than
     .note (a plain informational box): this means stored numbers may be
     wrong, not just "one provider's connection hiccuped." */
  #drift-banner {
    font-size: 13px;
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin: 0 0 14px;
  }
  #drift-banner strong { font-weight: 600; }
  #drift-banner .resync-btn {
    margin-left: 8px;
    font-size: 12px;
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: 4px;
    padding: 2px 8px;
    background: none;
    cursor: pointer;
  }
  #drift-banner .resync-btn:disabled { opacity: 0.6; cursor: default; }
  #drift-banner .drift-item { display: block; margin-bottom: 4px; }
  #drift-banner .drift-item:last-child { margin-bottom: 0; }
  /* Distinct from drift on purpose (warning, not danger) — this means
     "we don't know," not "we know it's wrong." */
  #unverifiable-banner {
    font-size: 13px;
    color: var(--warning);
    border: 1px solid var(--warning);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin: 0 0 14px;
  }
  #unverifiable-banner strong { font-weight: 600; }
  /* One shared grid for the whole project view (all three provider groups),
     instead of each .model-row being its own independent 3-column grid —
     that's what let column widths drift row to row before, since a fixed
     column set never aligned across rows with very different label lengths
     (API key names vs. project names). Flattening .model-row's children
     into this grid (display:contents) makes every bar track and amount in
     every group share the same two column edges, the way the model list's
     more uniform label lengths made it look aligned already. */
  #attribution-content {
    display: grid;
    grid-template-columns: minmax(0, 180px) 1fr auto;
    align-items: center;
    column-gap: 12px;
    row-gap: 6px;
  }
  #attribution-content .model-row { display: contents; }
  .attribution-group-label {
    grid-column: 1 / -1;
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
    margin: 0;
  }
  .attribution-group-label:not(:first-child) { margin-top: 10px; }
  .attribution-scope { font-weight: 400; color: var(--text-muted); }
  #summary-row {
    display: none;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
  }
  .stat-card-label {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
  }
  .stat-card-value {
    font-size: 24px;
    font-weight: 600;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .stat-card-value.stat-danger { color: var(--danger); }
  .stat-card-value.stat-warning { color: var(--warning); }
  /* Same status classes budgetStatus() drives on the overall Budget stat
     card above, reused verbatim on a department row's amount. */
  .model-amount.stat-danger { color: var(--danger); }
  .model-amount.stat-warning { color: var(--warning); }
  .stat-card-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .stat-card-meta a { color: var(--accent); text-decoration: none; }
  .stat-card-meta a:hover { text-decoration: underline; }
  .budget-bar-track { background: var(--grid); border-radius: 3px; height: 8px; margin-top: 10px; }
  .budget-bar { height: 100%; border-radius: 3px; background: var(--accent); }
  .budget-bar.bar-warning { background: var(--warning); }
  .budget-bar.bar-danger { background: var(--danger); }
  /* Over budget, not just at it — the track always caps at 100% width, so
     width alone can't show overflow. A stripe pattern does. */
  .budget-bar.bar-over {
    background-image: repeating-linear-gradient(135deg, var(--danger) 0 6px, rgba(0, 0, 0, 0.3) 6px 12px);
  }
  .budget-pct-over { color: var(--danger); font-weight: 600; }
  .budget-form { display: flex; gap: 8px; margin-top: 2px; }
  .budget-form input {
    width: 100px;
    font: inherit;
    font-size: 13px;
    padding: 6px 8px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--page);
    color: var(--text-primary);
  }
  /* Sim day/month advances (and month navigation) re-render these bars and
     headline numbers rather than the page reloading. These bars (model/
     project/department/top-spender/budget) are all *proportional to the
     render's own max* — so a bar's width can shift even when its own
     dollar amount didn't (some other row grew and became the new max).
     That rules out an "animate in from zero" keyframe on every render: a
     changed bar should visibly move by just the incremental amount, not
     regrow from nothing. Instead each render function sets the bar's
     *previous* rendered width inline as its starting style, then
     growBars() (in the page script below) flips it to the new target
     width on the next frame — a plain width transition, so a bar whose
     width didn't change just... doesn't move. */
  .model-bar, .budget-bar {
    transition: width 0.5s cubic-bezier(.22, .9, .32, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    .model-bar, .budget-bar { transition: none; }
  }
</style>
</head>
<body>
<header id="app-header"></header>
<main>
  <div id="drift-banner" style="display:none"></div>
  <div id="unverifiable-banner" style="display:none"></div>
  <div id="month-selector">
    <button id="month-prev" type="button" aria-label="Previous month">&larr;</button>
    <span id="month-label"></span>
    <button id="month-next" type="button" aria-label="Next month">&rarr;</button>
  </div>
  <p class="subtitle" id="subtitle">AI API spend, daily (UTC)</p>
  <div id="summary-row">
    <div class="stat-card">
      <div class="stat-card-label" id="mtd-label">Month to Date</div>
      <div class="stat-card-value" id="mtd-value">—</div>
      <div class="stat-card-meta" id="mtd-split" style="visibility:hidden"></div>
      <div class="stat-card-meta" id="mtd-range"></div>
      <div class="stat-card-meta" id="mtd-synced" style="visibility:hidden"></div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">Forecast</div>
      <div class="stat-card-value" id="forecast-value">—</div>
      <div class="stat-card-meta" id="forecast-meta">est. month-end</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">Budget</div>
      <div id="budget-content"></div>
    </div>
  </div>
  <div class="dashboard-grid">
    <div class="card">
      <div class="panel-header">
        <div>
          <div class="panel-title">Daily Spend</div>
          <div class="panel-description" id="chart-description"></div>
        </div>
      </div>
      <div class="panel-body" id="content"><div class="message">Loading cost data&hellip;</div></div>
    </div>
    <div class="card" id="breakdown-card" style="display:none">
      <div class="breakdown-tabs" role="tablist">
        <button type="button" class="breakdown-tab active" id="tab-models" data-tab="models" role="tab" aria-selected="true">By model</button>
        <button type="button" class="breakdown-tab" id="tab-attribution" data-tab="attribution" role="tab" aria-selected="false">By project</button>
        <button type="button" class="breakdown-tab" id="tab-departments" data-tab="departments" role="tab" aria-selected="false">By department</button>
        <button type="button" class="breakdown-tab" id="tab-people" data-tab="people" role="tab" aria-selected="false" style="display:none">Top spenders</button>
      </div>
      <div class="breakdown-body">
        <div id="models-pane">
          <div class="stat-label" id="models-label">Spend by model</div>
          <div id="models-content"></div>
        </div>
        <div id="attribution-pane" class="pane-hidden">
          <div class="stat-label" id="attribution-label">Spend by project</div>
          <div id="attribution-content"></div>
          <p class="section-footnote section-footnote-warning" id="attribution-unpriced-note" style="display:none"></p>
        </div>
        <div id="departments-pane" class="pane-hidden">
          <div class="stat-label" id="departments-label">Spend by department</div>
          <div id="departments-content"></div>
        </div>
        <div id="people-pane" class="pane-hidden">
          <div class="stat-label" id="people-label">Top spenders</div>
          <div id="people-content"></div>
        </div>
      </div>
    </div>
  </div>
  <details class="card" id="subscriptions-card" style="display:none">
    <summary class="stat-label" id="subscriptions-summary">Subscriptions &amp; other charges</summary>
    <div id="subscriptions-content"></div>
  </details>
</main>

<script type="module" src="/pages/dashboard.js"></script>
</body>
</html>
