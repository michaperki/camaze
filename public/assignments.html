<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/theme-init.js"></script>
<script src="/simulation.js"></script>
<link rel="stylesheet" href="/simulation.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>camaze — assignments</title>
<link rel="stylesheet" href="/shared.css">
<style>
  .data-table tbody tr.is-unassigned { background: color-mix(in srgb, var(--warning) 6%, transparent); }

  .provider-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  .provider-swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .entity-name { font-weight: 500; }
  .entity-scope { display: block; font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  button, input, select {
    font: inherit;
    font-size: 13px;
  }
  select, input[type="text"], input[type="email"], input[type="number"] {
    padding: 6px 8px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--page);
    color: var(--text-primary);
  }
  .row-select { width: 100%; min-width: 130px; }
  .row-status { font-size: 11px; color: var(--text-muted); margin-left: 6px; }
  .row-status.ok { color: var(--ok-fg); }
  .row-status.error { color: var(--danger); }

  form.create-form { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .field-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  form.create-form input, form.create-form select { width: 100%; }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .form-row > div { flex: 1; min-width: 140px; }
  .form-actions { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
  .form-error { font-size: 13px; color: var(--danger); }

  .inline-input {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    padding: 4px 6px;
    border-radius: 4px;
  }
  .inline-input:hover, .inline-input:focus { border-color: var(--border); background: var(--page); }
  .col-num { width: 100px; }
  .col-budget { width: 130px; }
</style>
</head>
<body>
<header id="app-header"></header>
<main>
  <p class="subtitle">Map API keys, workspaces, and projects to the department and person spending them</p>
  <div id="content"><div class="message">Loading&hellip;</div></div>
</main>

<script type="module" src="/pages/assignments.js"></script>
</body>
</html>
