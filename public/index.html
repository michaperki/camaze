<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>camaze — how much is that?!</title>
<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface-1:   #fcfcfb;
    --text-primary:#0b0b0b;
    --text-secondary:#52514e;
    --text-muted:  #898781;
    --grid:        #e1e0d9;
    --baseline:    #c3c2b7;
    --series-1:    #2a78d6;  /* Anthropic */
    --series-2:    #eb6834;  /* OpenAI */
    --series-3:    #1baf7a;  /* Google */
    --border:      rgba(11,11,11,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:        #0d0d0d;
      --surface-1:   #1a1a19;
      --text-primary:#ffffff;
      --text-secondary:#c3c2b7;
      --text-muted:  #898781;
      --grid:        #2c2c2a;
      --baseline:    #383835;
      --series-1:    #3987e5;
      --series-2:    #d95926;
      --series-3:    #199e70;
      --border:      rgba(255,255,255,0.10);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { color: var(--text-secondary); font-size: 13px; margin: 0 0 24px; }
  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px 16px;
  }
  #chrome { display: none; }
  #topbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 20px 0;
    font-size: 13px;
    color: var(--text-secondary);
  }
  #topbar button {
    font: inherit;
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  #topbar button:hover { color: var(--text-primary); }
  nav.tabs {
    display: flex;
    gap: 16px;
    max-width: 960px;
    margin: 0 auto;
    padding: 12px 20px 0;
    font-size: 13px;
  }
  nav.tabs a {
    color: var(--text-secondary);
    text-decoration: none;
    padding-bottom: 8px;
    border-bottom: 2px solid transparent;
  }
  nav.tabs a:hover { color: var(--text-primary); }
  nav.tabs a.active {
    color: var(--text-primary);
    border-bottom-color: var(--series-1);
    font-weight: 600;
  }
  .stat-label { font-size: 13px; color: var(--text-secondary); }
  .stat-value { font-size: 48px; font-weight: 600; line-height: 1.15; margin: 2px 0 8px; }
  .stat-meta { font-size: 12px; color: var(--text-muted); margin: -4px 0 8px; }
  .legend { display: flex; gap: 20px; flex-wrap: wrap; margin: 0 0 16px; font-size: 13px; }
  .legend-item { display: flex; align-items: center; gap: 7px; color: var(--text-secondary); }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend-total { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .notes { margin: 0 0 12px; }
  .note { font-size: 13px; color: var(--text-secondary); padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; }
  .message { color: var(--text-secondary); font-size: 14px; padding: 24px 0; }
  .message a { color: var(--series-1); }
  #chart-wrap { position: relative; }
  svg { display: block; width: 100%; height: auto; }
  .tick-label, .x-label { font-size: 11px; fill: var(--text-muted); }
  .tick-label { font-variant-numeric: tabular-nums; }
  #tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    white-space: nowrap;
    display: none;
    z-index: 2;
  }
  #tooltip .t-date { color: var(--text-secondary); margin-bottom: 3px; }
  #tooltip .t-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  #tooltip .t-value { font-weight: 600; font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 12px; }
  #models-card { margin-top: 16px; }
  .model-row {
    display: grid;
    grid-template-columns: minmax(0, 180px) 1fr auto;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
  }
  .model-row:first-of-type { margin-top: 12px; }
  .model-label {
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .model-bar-track { background: var(--grid); border-radius: 3px; height: 14px; }
  .model-bar { height: 100%; border-radius: 3px; min-width: 3px; }
  .model-amount {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--text-secondary);
    text-align: right;
  }
</style>
</head>
<body>
<div id="chrome">
  <div id="topbar">
    <span id="user-email"></span>
    <button id="signout-btn" type="button">Sign out</button>
  </div>
  <nav class="tabs">
    <a href="/index.html" class="active">Dashboard</a>
    <a href="/integrations.html">Integrations</a>
  </nav>
</div>
<main>
  <h1>camaze <span style="color:var(--text-muted);font-weight:400">— how much is that?!</span></h1>
  <p class="subtitle">AI API spend, daily, last 30 days (UTC)</p>
  <div class="card">
    <div id="content"><div class="message">Loading cost data&hellip;</div></div>
  </div>
  <div class="card" id="models-card" style="display:none">
    <div class="stat-label">Spend by model, last 30 days</div>
    <div id="models-content"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SERIES_VARS = {
  anthropic: "var(--series-1)",
  openai: "var(--series-2)",
  google: "var(--series-3)",
};

const fmtUSD = (v, opts = {}) =>
  v.toLocaleString("en-US", { style: "currency", currency: "USD", ...opts });

const fmtDate = (iso) =>
  new Date(iso + "T00:00:00Z").toLocaleDateString("en-US", {
    month: "short", day: "numeric", timeZone: "UTC",
  });

function niceTicks(max) {
  if (max <= 0) return [0, 1];
  const rough = max / 4;
  const pow = Math.pow(10, Math.floor(Math.log10(rough)));
  const step = [1, 2, 5, 10].map(m => m * pow).find(s => s >= rough);
  const ticks = [];
  for (let v = 0; v <= max + 1e-9; v += step) ticks.push(v);
  if (ticks[ticks.length - 1] < max) ticks.push(ticks.length * step);
  return ticks;
}

const esc = (s) => String(s).replace(/</g, "&lt;");

function fmtAgo(iso) {
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins <= 0) return "just now";
  if (mins === 1) return "1 minute ago";
  return `${mins} minutes ago`;
}

function render({ providers, days, totals, errors, cached, cachedAt }) {
  const content = document.getElementById("content");
  const active = providers.filter(p => !p.failed);

  // Per-provider failure notes (shown above the chart, plainly).
  let notes = "";
  for (const p of providers) {
    if (!p.failed) continue;
    const others = active.map(a => a.label).join(", ");
    notes += `<div class="note"><strong>${esc(p.label)}</strong>: ${esc(errors[p.name])}` +
      (others ? ` — showing ${esc(others)} only.` : "") + "</div>";
  }

  if (active.length === 0) {
    content.innerHTML = `<div class="notes">${notes}</div>` +
      '<div class="message">No provider data could be loaded.</div>';
    return;
  }

  const meta = cached && cachedAt
    ? `<div class="stat-meta">as of ${esc(fmtAgo(cachedAt))} &middot; refreshes every 5 min</div>`
    : "";

  const header =
    '<div class="stat-label">Total, last 30 days</div>' +
    '<div class="stat-value">' + fmtUSD(totals.combined) + "</div>" +
    meta +
    '<div class="legend">' +
    active.map(p =>
      `<span class="legend-item"><span class="legend-swatch" style="background:${SERIES_VARS[p.name]}"></span>` +
      `${esc(p.label)} <span class="legend-total">${fmtUSD(totals[p.name])}</span></span>`
    ).join("") +
    "</div>" +
    (notes ? `<div class="notes">${notes}</div>` : "");

  if (days.every(d => active.every(p => d[p.name] === 0))) {
    content.innerHTML = header + '<div class="message">No spend recorded in this period.</div>';
    return;
  }

  const W = 920, H = 300;
  const m = { top: 8, right: 8, bottom: 26, left: 52 };
  const innerW = W - m.left - m.right;
  const innerH = H - m.top - m.bottom;
  const dayTotal = d => active.reduce((s, p) => s + d[p.name], 0);
  const ticks = niceTicks(Math.max(...days.map(dayTotal)));
  const yMax = ticks[ticks.length - 1];
  const y = v => m.top + innerH - (v / yMax) * innerH;
  const band = innerW / days.length;
  const barW = Math.min(24, band - 2);          // ≤24px bar, ≥2px gap between bars
  const baseline = m.top + innerH;
  const r = 4;                                   // rounded data-end (top of stack)
  const GAP = 2;                                 // surface gap between stacked segments

  let s = "";
  for (const t of ticks) {
    s += `<line x1="${m.left}" x2="${W - m.right}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text class="tick-label" x="${m.left - 8}" y="${y(t) + 3.5}" text-anchor="end">${t >= 1 ? "$" + t.toLocaleString("en-US") : fmtUSD(t)}</text>`;
  }

  // Stacked bars: fixed provider order bottom-up; topmost visible segment gets
  // the rounded cap; a 2px surface gap separates touching segments.
  days.forEach((d, i) => {
    const x = m.left + i * band + (band - barW) / 2;
    const segs = active
      .map(p => ({ name: p.name, usd: d[p.name] }))
      .filter(seg => seg.usd > 0);
    let cum = 0;
    segs.forEach((seg, k) => {
      const bottomVal = cum, topVal = cum + seg.usd;
      cum = topVal;
      let yBottom = y(bottomVal);
      let yTop = y(topVal);
      if (k > 0) yBottom -= GAP;                 // surface gap below this segment
      const h = yBottom - yTop;
      if (h <= 0.5) return;
      const isTop = k === segs.length - 1;
      const fill = SERIES_VARS[seg.name];
      if (isTop) {
        const rr = Math.min(r, h, barW / 2);
        s += `<path d="M${x},${yBottom} L${x},${yTop + rr} Q${x},${yTop} ${x + rr},${yTop} L${x + barW - rr},${yTop} Q${x + barW},${yTop} ${x + barW},${yTop + rr} L${x + barW},${yBottom} Z" fill="${fill}"/>`;
      } else {
        s += `<rect x="${x}" y="${yTop}" width="${barW}" height="${h}" fill="${fill}"/>`;
      }
    });
  });

  s += `<line x1="${m.left}" x2="${W - m.right}" y1="${baseline}" y2="${baseline}" stroke="var(--baseline)" stroke-width="1"/>`;
  days.forEach((d, i) => {
    if (i % 5 !== 0 && i !== days.length - 1) return;
    const cx = m.left + i * band + band / 2;
    s += `<text class="x-label" x="${cx}" y="${H - 8}" text-anchor="middle">${fmtDate(d.date)}</text>`;
  });
  // full-band hover targets (bigger than the marks)
  days.forEach((d, i) => {
    s += `<rect data-i="${i}" x="${m.left + i * band}" y="${m.top}" width="${band}" height="${innerH}" fill="transparent"/>`;
  });

  content.innerHTML = header +
    '<div id="chart-wrap">' +
    `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Stacked bar chart of daily AI API spend by provider over the last 30 days">${s}</svg>` +
    '<div id="tooltip"></div></div>';

  const wrap = document.getElementById("chart-wrap");
  const tooltip = document.getElementById("tooltip");
  wrap.addEventListener("mousemove", (e) => {
    const t = e.target.closest("rect[data-i]");
    if (!t) { tooltip.style.display = "none"; return; }
    const d = days[+t.dataset.i];
    tooltip.innerHTML =
      `<div class="t-date">${fmtDate(d.date)} &middot; ${fmtUSD(dayTotal(d))}</div>` +
      active.map(p =>
        `<div class="t-row"><span class="legend-swatch" style="background:${SERIES_VARS[p.name]}"></span>` +
        `${esc(p.label)}<span class="t-value">${fmtUSD(d[p.name])}</span></div>`
      ).join("");
    tooltip.style.display = "block";
    const box = wrap.getBoundingClientRect();
    const tx = Math.min(e.clientX - box.left + 12, box.width - tooltip.offsetWidth - 4);
    tooltip.style.left = tx + "px";
    tooltip.style.top = (e.clientY - box.top - 48) + "px";
  });
  wrap.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
}

// Raw model IDs aren't how anyone talks about these models — reformat the
// common Anthropic/OpenAI naming patterns into something readable. Google's
// `model` is already sku.description text from GCP, so it's left as-is.
function prettifyModel(provider, model) {
  if (provider === "anthropic") {
    // "claude-sonnet-4-6" -> "Claude Sonnet 4.6"; "claude-haiku-4-5-20251001"
    // -> "Claude Haiku 4.5" (snapshot date suffix dropped).
    const parts = model.replace(/-\d{8}$/, "").split("-");
    if (parts[0] !== "claude" || parts.length < 2) return model;
    const family = parts[1][0].toUpperCase() + parts[1].slice(1);
    const versionParts = parts.slice(2);
    if (versionParts.length === 0) return `Claude ${family}`;
    const version = versionParts.every(p => /^\d+$/.test(p))
      ? versionParts.join(".")
      : versionParts.join(" ");
    return `Claude ${family} ${version}`;
  }
  if (provider === "openai") {
    // "gpt-5.2-2025-12-11" -> "GPT-5.2"; "gpt-4o-mini-2024-07-18" -> "GPT-4o mini".
    const stripped = model.replace(/-\d{4}-\d{2}-\d{2}$/, "");
    const m = stripped.match(/^gpt-([0-9.]+[a-z]*)(-(.+))?$/i);
    if (!m) return stripped;
    return `GPT-${m[1]}${m[3] ? " " + m[3].replace(/-/g, " ") : ""}`;
  }
  return model;
}

function renderModels(models) {
  const card = document.getElementById("models-card");
  if (!models || models.length === 0) {
    card.style.display = "none";
    return;
  }
  card.style.display = "block";

  const maxAmount = Math.max(...models.map(m => m.amount_usd));
  document.getElementById("models-content").innerHTML = models.map(m => {
    const pct = maxAmount > 0 ? Math.max((m.amount_usd / maxAmount) * 100, 1) : 0;
    const fill = SERIES_VARS[m.provider] || "var(--text-muted)";
    const label = prettifyModel(m.provider, m.model);
    return (
      '<div class="model-row">' +
      `<span class="model-label" title="${esc(m.model)}">${esc(label)}</span>` +
      '<div class="model-bar-track">' +
      `<div class="model-bar" style="width:${pct}%;background:${fill}"></div>` +
      "</div>" +
      `<span class="model-amount">${fmtUSD(m.amount_usd)}</span>` +
      "</div>"
    );
  }).join("");
}

function loadDashboard(accessToken) {
  // Set by the Integrations page right after connecting/disconnecting a
  // provider — bypass the cache once so the change shows up immediately.
  const forceRefresh = sessionStorage.getItem("camaze_keys_changed");
  if (forceRefresh) sessionStorage.removeItem("camaze_keys_changed");
  const url = "/api/costs" + (forceRefresh ? "?refresh=1" : "");

  fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } })
    .then(async (res) => {
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      if (data.no_keys) {
        document.getElementById("content").innerHTML =
          '<div class="message">No providers connected yet. ' +
          '<a href="/integrations.html">Go to Integrations</a> to get started.</div>';
        renderModels([]);
        return;
      }
      render(data);
      renderModels(data.models);
    })
    .catch((err) => {
      document.getElementById("content").innerHTML =
        '<div class="message">Could not load cost data: ' + esc(err.message) + "</div>";
      renderModels([]);
    });
}

(async () => {
  const cfgRes = await fetch("/api/config");
  const cfg = await cfgRes.json();
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
    document.getElementById("content").innerHTML =
      '<div class="message">Auth is not configured (missing SUPABASE_URL/SUPABASE_ANON_KEY).</div>';
    return;
  }

  const client = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  // Also exchanges an OAuth code in the URL for a session, if present.
  const { data: { session } } = await client.auth.getSession();
  if (!session) {
    window.location.replace("/login.html");
    return;
  }

  document.getElementById("user-email").textContent = session.user.email ?? "";
  document.getElementById("chrome").style.display = "block";
  document.getElementById("signout-btn").addEventListener("click", async () => {
    await client.auth.signOut();
    window.location.replace("/login.html");
  });

  loadDashboard(session.access_token);
})();
</script>
</body>
</html>
