<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>camaze — gateway</title>
<style>
  :root {
    color-scheme: dark light;
    --page:        #f9f9f7;
    --surface-1:   #fcfcfb;
    --text-primary:#0b0b0b;
    --text-secondary:#52514e;
    --text-muted:  #898781;
    --border:      rgba(11,11,11,0.10);
    --series-1:    #2a78d6;  /* Anthropic */
    --series-2:    #eb6834;  /* OpenAI */
    --accent:      #2a78d6;
    --danger:      #c0392b;
    --ok-bg:       #e7f5ee;
    --ok-fg:       #1a7a4c;
    --code-bg:     #f0efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page:        #0d0d0d;
      --surface-1:   #1a1a19;
      --text-primary:#ffffff;
      --text-secondary:#c3c2b7;
      --text-muted:  #898781;
      --border:      rgba(255,255,255,0.10);
      --series-1:    #3987e5;
      --series-2:    #d95926;
      --accent:      #3987e5;
      --danger:      #e0655a;
      --ok-bg:       #113325;
      --ok-fg:       #4fd18f;
      --code-bg:     #161615;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--page); }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 20px 48px; }
  .subtitle { color: var(--text-secondary); font-size: 13px; margin: 0 0 24px; }
  #app-header { border-bottom: 1px solid var(--border); }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 20px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .wordmark {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    text-decoration: none;
    flex: none;
    letter-spacing: -0.01em;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--text-secondary);
    flex: none;
    visibility: hidden;
  }
  .header-right button {
    font: inherit;
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .header-right button:hover { color: var(--text-primary); }
  nav.tabs {
    display: flex;
    gap: 16px;
    font-size: 13px;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs a {
    color: var(--text-secondary);
    text-decoration: none;
    padding: 4px 0;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  nav.tabs a:hover { color: var(--text-primary); }
  nav.tabs a.active {
    color: var(--text-primary);
    border-bottom-color: var(--series-1);
    font-weight: 600;
  }
  @media (max-width: 700px) {
    .header-inner { padding: 0 14px; gap: 14px; }
    #user-email { display: none; }
  }

  .message { color: var(--text-secondary); font-size: 14px; padding: 24px 0; }

  section { margin-bottom: 40px; }
  h2 { font-size: 16px; margin: 0 0 4px; }
  .section-hint { color: var(--text-secondary); font-size: 13px; margin: 0 0 16px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    font-weight: 600;
    color: var(--text-muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 0 10px 8px;
    border-bottom: 1px solid var(--border);
  }
  tbody td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  .provider-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
  }
  .provider-swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .key-prefix { font-variant-numeric: tabular-nums; font-family: ui-monospace, monospace; }
  .col-actions { text-align: right; }

  button, input, select {
    font: inherit;
    font-size: 13px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--page);
    color: var(--text-primary);
    cursor: pointer;
  }
  .btn:hover { border-color: var(--text-muted); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-text {
    background: none;
    border: none;
    padding: 4px 2px;
    font-size: 12px;
    color: var(--text-muted);
    text-decoration: underline;
    text-decoration-color: transparent;
    cursor: pointer;
  }
  .btn-text:hover { color: var(--danger); text-decoration-color: currentColor; }
  .btn-text:disabled { opacity: 0.6; cursor: default; }

  .create-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-top: 14px;
  }
  form.create-form { display: flex; flex-direction: column; gap: 10px; }
  .field-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  input[type="text"], select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--page);
    color: var(--text-primary);
    font-family: inherit;
  }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .form-row > div { flex: 1; min-width: 160px; }
  .form-actions { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
  .form-error { font-size: 13px; color: var(--danger); }

  .reveal-card {
    background: var(--ok-bg);
    border: 1px solid var(--ok-fg);
    border-radius: 10px;
    padding: 16px 18px;
    margin-top: 14px;
  }
  .reveal-card .field-label { color: var(--ok-fg); }
  .reveal-key {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 0 10px;
  }
  .reveal-key code {
    flex: 1;
    background: var(--code-bg);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    overflow-x: auto;
    white-space: nowrap;
  }
  .reveal-warning { font-size: 12px; color: var(--text-secondary); margin: 0 0 10px; }

  .instructions { line-height: 1.6; font-size: 13px; color: var(--text-secondary); }
  .instructions h3 { font-size: 14px; color: var(--text-primary); margin: 20px 0 8px; }
  .instructions h3:first-child { margin-top: 0; }
  .instructions code { font-family: ui-monospace, monospace; font-size: 12px; }
  pre {
    background: var(--code-bg);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    line-height: 1.6;
    margin: 8px 0 0;
  }
</style>
</head>
<body>
<header id="app-header">
  <div class="header-inner">
    <a class="wordmark" href="/dashboard.html">camaze</a>
    <nav class="tabs">
      <a href="/dashboard.html">Dashboard</a>
      <a href="/integrations.html">Integrations</a>
      <a href="/notifications.html">Notifications</a>
      <a href="/gateway.html" class="active">Gateway</a>
    </nav>
    <div class="header-right" id="header-right">
      <span id="user-email"></span>
      <button id="signout-btn" type="button">Sign out</button>
    </div>
  </div>
</header>
<main>
  <p class="subtitle">Route your app's Anthropic/OpenAI calls through camaze to attribute cost by workflow</p>
  <div id="content"><div class="message">Loading&hellip;</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const PROVIDER_META = {
  anthropic: { label: "Anthropic", swatch: "var(--series-1)" },
  openai: { label: "OpenAI", swatch: "var(--series-2)" },
};

const esc = (s) => String(s).replace(/</g, "&lt;");
const fmtDate = (iso) => new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });

function keysTableHtml(keys) {
  if (keys.length === 0) {
    return '<div class="message">No gateway keys yet — create one below.</div>';
  }
  const rows = keys.map((k) => {
    const meta = PROVIDER_META[k.provider] || { label: k.provider, swatch: "var(--text-muted)" };
    return `
      <tr data-id="${esc(k.id)}">
        <td>${esc(k.label)}</td>
        <td><span class="provider-pill"><span class="provider-swatch" style="background:${meta.swatch}"></span>${esc(meta.label)}</span></td>
        <td class="key-prefix">cz-live-&hellip;${esc(k.hint || "")}</td>
        <td>${esc(fmtDate(k.createdAt))}</td>
        <td class="col-actions"><button class="btn-text" type="button" data-action="revoke" data-id="${esc(k.id)}">Revoke</button></td>
      </tr>`;
  }).join("");
  return `
    <table>
      <thead>
        <tr><th>Label</th><th>Provider</th><th>Key</th><th>Created</th><th></th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function revealHtml(key) {
  return `
    <div class="reveal-card" data-role="reveal">
      <div class="field-label">Your new gateway key</div>
      <div class="reveal-key">
        <code>${esc(key)}</code>
        <button class="btn" type="button" data-action="copy-key" data-key="${esc(key)}">Copy</button>
      </div>
      <p class="reveal-warning">This key will not be shown again. Store it somewhere safe.</p>
      <button class="btn btn-primary" type="button" data-action="dismiss-reveal">Done</button>
    </div>`;
}

function instructionsHtml(appUrl) {
  const base = appUrl || "https://YOUR_VERCEL_URL";
  return `
    <div class="instructions">
      <h3>Anthropic (Python)</h3>
      <pre># Before
client = Anthropic(api_key="sk-ant-...")

# After
client = Anthropic(
    api_key="cz-live-...",
    base_url="${esc(base)}/api/gateway/anthropic",
)

# Optional: attribute spend to a workflow
# client = Anthropic(..., default_headers={"X-Camaze-Workflow": "your-workflow-name"})</pre>

      <h3>OpenAI (Python)</h3>
      <pre># Before
client = OpenAI(api_key="sk-...")

# After
client = OpenAI(
    api_key="cz-live-...",
    base_url="${esc(base)}/api/gateway/openai",
)</pre>

      <p style="margin-top:16px">Replace <code>cz-live-...</code> with a key created above, and
      <code>${esc(base)}</code> with your actual Vercel domain if it isn't detected correctly.
      Everything else about your code — models, streaming, response shapes — stays identical.</p>
    </div>`;
}

async function main() {
  const cfgRes = await fetch("/api/config");
  const cfg = await cfgRes.json();
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
    document.getElementById("content").innerHTML =
      '<div class="message">Auth is not configured (missing SUPABASE_URL/SUPABASE_ANON_KEY).</div>';
    return;
  }

  const client = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const { data: { session } } = await client.auth.getSession();
  if (!session) {
    window.location.replace("/login.html");
    return;
  }

  document.getElementById("user-email").textContent = session.user.email ?? "";
  document.getElementById("header-right").style.visibility = "visible";
  document.getElementById("signout-btn").addEventListener("click", async () => {
    await client.auth.signOut();
    window.location.replace("/login.html");
  });

  const authHeaders = { Authorization: `Bearer ${session.access_token}` };
  const appUrl = window.location.origin;

  const content = document.getElementById("content");
  content.innerHTML = `
    <section id="keys-section">
      <h2>Gateway keys</h2>
      <p class="section-hint">Each key is scoped to one provider and can be revoked at any time.</p>
      <div id="keys-table"><div class="message">Loading&hellip;</div></div>
      <div class="create-card">
        <button class="btn" type="button" id="toggle-create">Create key</button>
        <form class="create-form" id="create-form" style="display:none">
          <div class="form-row">
            <div>
              <div class="field-label">Label</div>
              <input type="text" name="label" placeholder="e.g. prod-agent" required>
            </div>
            <div>
              <div class="field-label">Provider</div>
              <select name="provider" required>
                <option value="anthropic">Anthropic</option>
                <option value="openai">OpenAI</option>
              </select>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit">Create</button>
            <span class="form-error" data-role="error"></span>
          </div>
        </form>
        <div id="reveal-slot"></div>
      </div>
    </section>
    <section>
      <h2>Setup instructions</h2>
      <p class="section-hint">Point your app's Anthropic/OpenAI client at camaze instead of the provider directly.</p>
      ${instructionsHtml(appUrl)}
    </section>`;

  async function loadKeys() {
    const res = await fetch("/api/gateway-keys", { headers: authHeaders });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    document.getElementById("keys-table").innerHTML = keysTableHtml(data.keys || []);
  }

  const toggleBtn = document.getElementById("toggle-create");
  const form = document.getElementById("create-form");
  toggleBtn.addEventListener("click", () => {
    form.style.display = form.style.display === "none" ? "flex" : "none";
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const errorEl = form.querySelector('[data-role="error"]');
    errorEl.textContent = "";

    const formData = new FormData(form);
    const body = { label: formData.get("label"), provider: formData.get("provider") };

    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating…";

    fetch("/api/gateway-keys", {
      method: "POST",
      headers: { ...authHeaders, "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })
      .then(async (res) => {
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        form.reset();
        form.style.display = "none";
        document.getElementById("reveal-slot").innerHTML = revealHtml(data.key);
        return loadKeys();
      })
      .catch((err) => {
        errorEl.textContent = err.message;
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = "Create";
      });
  });

  content.addEventListener("click", (e) => {
    const copyBtn = e.target.closest('[data-action="copy-key"]');
    if (copyBtn) {
      navigator.clipboard?.writeText(copyBtn.dataset.key).catch(() => {});
      copyBtn.textContent = "Copied";
      setTimeout(() => { copyBtn.textContent = "Copy"; }, 1500);
      return;
    }

    const dismissBtn = e.target.closest('[data-action="dismiss-reveal"]');
    if (dismissBtn) {
      document.getElementById("reveal-slot").innerHTML = "";
      return;
    }

    const revokeBtn = e.target.closest('[data-action="revoke"]');
    if (revokeBtn) {
      const id = revokeBtn.dataset.id;
      if (!confirm("Revoke this gateway key? Any app still using it will start failing immediately.")) return;
      revokeBtn.disabled = true;
      fetch(`/api/gateway-keys?id=${encodeURIComponent(id)}`, { method: "DELETE", headers: authHeaders })
        .then(async (res) => {
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          return loadKeys();
        })
        .catch((err) => {
          revokeBtn.disabled = false;
          alert(`Could not revoke: ${err.message}`);
        });
    }
  });

  await loadKeys();
}

main().catch((err) => {
  document.getElementById("content").innerHTML =
    '<div class="message">Could not load gateway: ' + esc(err.message) + "</div>";
});
</script>
</body>
</html>
