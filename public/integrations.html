<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>camaze — integrations</title>
<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface-1:   #fcfcfb;
    --text-primary:#0b0b0b;
    --text-secondary:#52514e;
    --text-muted:  #898781;
    --border:      rgba(11,11,11,0.10);
    --series-1:    #2a78d6;  /* Anthropic */
    --series-2:    #eb6834;  /* OpenAI */
    --series-3:    #1baf7a;  /* Google */
    --accent:      #2a78d6;
    --danger:      #c0392b;
    --ok-bg:       #e7f5ee;
    --ok-fg:       #1a7a4c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:        #0d0d0d;
      --surface-1:   #1a1a19;
      --text-primary:#ffffff;
      --text-secondary:#c3c2b7;
      --text-muted:  #898781;
      --border:      rgba(255,255,255,0.10);
      --series-1:    #3987e5;
      --series-2:    #d95926;
      --series-3:    #199e70;
      --accent:      #3987e5;
      --danger:      #e0655a;
      --ok-bg:       #113325;
      --ok-fg:       #4fd18f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 24px 20px 48px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { color: var(--text-secondary); font-size: 13px; margin: 0 0 24px; }
  #chrome { display: none; }
  #topbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 20px 0;
    font-size: 13px;
    color: var(--text-secondary);
  }
  #topbar button {
    font: inherit;
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  #topbar button:hover { color: var(--text-primary); }
  nav.tabs {
    display: flex;
    gap: 16px;
    max-width: 960px;
    margin: 0 auto;
    padding: 12px 20px 0;
    font-size: 13px;
  }
  nav.tabs a {
    color: var(--text-secondary);
    text-decoration: none;
    padding-bottom: 8px;
    border-bottom: 2px solid transparent;
  }
  nav.tabs a:hover { color: var(--text-primary); }
  nav.tabs a.active {
    color: var(--text-primary);
    border-bottom-color: var(--series-1);
    font-weight: 600;
  }

  .message { color: var(--text-secondary); font-size: 14px; padding: 24px 0; }

  .provider-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .provider-head {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .provider-swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .provider-name { font-size: 15px; font-weight: 600; margin-right: auto; }
  .time-estimate { font-size: 12px; color: var(--text-muted); }
  .status-pill {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    color: var(--text-secondary);
    background: var(--page);
    border: 1px solid var(--border);
  }
  .status-pill.connected { color: var(--ok-fg); background: var(--ok-bg); border-color: transparent; }

  .provider-body { margin-top: 12px; font-size: 13px; color: var(--text-secondary); }
  .key-hint { font-variant-numeric: tabular-nums; color: var(--text-primary); font-size: 13px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; }

  button, input {
    font: inherit;
    font-size: 13px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--page);
    color: var(--text-primary);
    cursor: pointer;
  }
  .btn:hover { border-color: var(--text-muted); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-danger { color: var(--danger); }

  .instructions { margin: 10px 0 12px; line-height: 1.6; }
  .instructions ol { margin: 6px 0 0; padding-left: 20px; }
  .instructions a { color: var(--accent); }

  form.connect-form { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .field-label { font-size: 12px; color: var(--text-muted); }
  input[type="text"], input[type="password"], textarea {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--page);
    color: var(--text-primary);
    font-family: inherit;
  }
  textarea { min-height: 90px; resize: vertical; font-family: ui-monospace, monospace; font-size: 12px; }
  .form-actions { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .form-error { font-size: 13px; color: var(--danger); }
</style>
</head>
<body>
<div id="chrome">
  <div id="topbar">
    <span id="user-email"></span>
    <button id="signout-btn" type="button">Sign out</button>
  </div>
  <nav class="tabs">
    <a href="/index.html">Dashboard</a>
    <a href="/integrations.html" class="active">Integrations</a>
  </nav>
</div>
<main>
  <h1>Integrations</h1>
  <p class="subtitle">Connect your own provider keys — stored encrypted, used only to fetch your spend</p>
  <div id="content"><div class="message">Loading&hellip;</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const README_URL = "https://github.com/michaperki/camaze/blob/main/README.md#setup";

const PROVIDERS = [
  {
    name: "anthropic",
    label: "Anthropic",
    swatch: "var(--series-1)",
    time: "~2 min",
    instructions: `
      <p>This lets camaze read your Anthropic spend — it can't send messages or spend your credits.</p>
      <ol>
        <li>Go to <a href="https://console.anthropic.com/settings/admin-keys" target="_blank" rel="noopener">console.anthropic.com</a> and sign in.</li>
        <li>In the left sidebar, click <strong>Settings</strong>, then <strong>Admin keys</strong>.</li>
        <li>Click <strong>Create Key</strong>, give it any name, and copy the key (starts with <code>sk-ant-admin...</code>). You won't be able to see it again after this.</li>
        <li>Paste it below.</li>
      </ol>`,
  },
  {
    name: "openai",
    label: "OpenAI",
    swatch: "var(--series-2)",
    time: "~2 min",
    instructions: `
      <p>This lets camaze read your OpenAI spend — it can't use your credits.</p>
      <ol>
        <li>Go to <a href="https://platform.openai.com/settings/organization/admin-keys" target="_blank" rel="noopener">platform.openai.com</a> and sign in.</li>
        <li>Click <strong>Settings</strong>, then <strong>Organization</strong>, then <strong>Admin keys</strong>.</li>
        <li>Click <strong>Create</strong>, give it any name, and copy the key (starts with <code>sk-admin-...</code>). You won't be able to see it again after this.</li>
        <li>Paste it below.</li>
      </ol>`,
  },
  {
    name: "google",
    label: "Google",
    swatch: "var(--series-3)",
    time: "~10 min · Advanced",
    google: true,
    instructions: `
      <p>Google doesn't have a simple spend page like the others — billing has to already be
      exported to a BigQuery table, and connecting it needs a small credentials file from that
      setup (a "service account key"), plus the project and dataset it lives in. This one's more
      involved and is meant for whoever manages your Google Cloud billing.
      Full walkthrough in the <a href="${README_URL}" target="_blank" rel="noopener">README</a>.</p>`,
  },
];

const esc = (s) => String(s).replace(/</g, "&lt;");

function fieldsHtml(provider) {
  if (provider.google) {
    return `
      <div>
        <div class="field-label">Service account JSON (paste the entire file contents)</div>
        <textarea name="serviceAccountJson" placeholder='{"type": "service_account", ...}' required></textarea>
      </div>
      <div>
        <div class="field-label">Billing project ID</div>
        <input type="text" name="project" placeholder="my-gcp-project" required>
      </div>
      <div>
        <div class="field-label">Billing dataset (optional — defaults to billing_export)</div>
        <input type="text" name="dataset" placeholder="billing_export">
      </div>`;
  }
  return `
    <div>
      <div class="field-label">Admin key</div>
      <input type="password" name="key" placeholder="${provider.name === "anthropic" ? "sk-ant-admin-..." : "sk-admin-..."}" required autocomplete="off">
    </div>`;
}

function cardHtml(provider, state) {
  const connected = !!state?.connected;
  const statusHtml = connected
    ? `<span class="status-pill connected">Connected</span>`
    : `<span class="status-pill">Not connected</span>`;

  let body;
  if (connected) {
    const hint = provider.google
      ? `Billing project <span class="key-hint">${esc(state.hint || "")}</span>`
      : `<span class="key-hint">${provider.name === "anthropic" ? "sk-ant-admin" : "sk-admin"}...${esc(state.hint || "")}</span>`;
    body = `
      <div class="provider-body">
        <div class="row">
          <span>${hint}</span>
          <button class="btn btn-danger" type="button" data-action="disconnect" data-provider="${provider.name}">Disconnect</button>
        </div>
      </div>`;
  } else {
    body = `
      <div class="provider-body">
        <div class="instructions">${provider.instructions}</div>
        <button class="btn" type="button" data-action="toggle-form" data-provider="${provider.name}">Connect</button>
        <form class="connect-form" data-provider="${provider.name}" style="display:none">
          <input type="hidden" name="provider" value="${esc(provider.name)}">
          ${fieldsHtml(provider)}
          <div class="form-actions">
            <button class="btn btn-primary" type="submit">Connect</button>
            <span class="form-error" data-role="error"></span>
          </div>
        </form>
      </div>`;
  }

  return `
    <div class="provider-card" data-card="${provider.name}">
      <div class="provider-head">
        <span class="provider-swatch" style="background:${provider.swatch}"></span>
        <span class="provider-name">${esc(provider.label)}</span>
        <span class="time-estimate">${esc(provider.time)}</span>
        ${statusHtml}
      </div>
      ${body}
    </div>`;
}

function render(providerStates) {
  const content = document.getElementById("content");
  content.innerHTML = PROVIDERS.map(p => cardHtml(p, providerStates[p.name])).join("");
}

async function main() {
  const cfgRes = await fetch("/api/config");
  const cfg = await cfgRes.json();
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
    document.getElementById("content").innerHTML =
      '<div class="message">Auth is not configured (missing SUPABASE_URL/SUPABASE_ANON_KEY).</div>';
    return;
  }

  const client = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const { data: { session } } = await client.auth.getSession();
  if (!session) {
    window.location.replace("/login.html");
    return;
  }

  document.getElementById("user-email").textContent = session.user.email ?? "";
  document.getElementById("chrome").style.display = "block";
  document.getElementById("signout-btn").addEventListener("click", async () => {
    await client.auth.signOut();
    window.location.replace("/login.html");
  });

  const authHeaders = { Authorization: `Bearer ${session.access_token}` };

  async function loadKeys() {
    const res = await fetch("/api/keys", { headers: authHeaders });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    render(data.providers || {});
  }

  const content = document.getElementById("content");

  content.addEventListener("click", (e) => {
    const toggleBtn = e.target.closest('[data-action="toggle-form"]');
    if (toggleBtn) {
      const card = toggleBtn.closest(".provider-card");
      const form = card.querySelector("form.connect-form");
      form.style.display = form.style.display === "none" ? "flex" : "none";
      return;
    }

    const disconnectBtn = e.target.closest('[data-action="disconnect"]');
    if (disconnectBtn) {
      const provider = disconnectBtn.dataset.provider;
      disconnectBtn.disabled = true;
      fetch(`/api/keys?provider=${encodeURIComponent(provider)}`, { method: "DELETE", headers: authHeaders })
        .then(async (res) => {
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          sessionStorage.setItem("camaze_keys_changed", "1");
          return loadKeys();
        })
        .catch((err) => {
          disconnectBtn.disabled = false;
          alert(`Could not disconnect: ${err.message}`);
        });
    }
  });

  content.addEventListener("submit", (e) => {
    const form = e.target.closest("form.connect-form");
    if (!form) return;
    e.preventDefault();

    const errorEl = form.querySelector('[data-role="error"]');
    errorEl.textContent = "";

    const formData = new FormData(form);
    const body = {};
    for (const [k, v] of formData.entries()) {
      if (v) body[k] = v;
    }

    if (!body.provider) {
      errorEl.textContent = "Something went wrong reading the form — please refresh and try again.";
      return;
    }

    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = "Connecting…";

    fetch("/api/keys", {
      method: "POST",
      headers: { ...authHeaders, "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })
      .then(async (res) => {
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        sessionStorage.setItem("camaze_keys_changed", "1");
        return loadKeys();
      })
      .catch((err) => {
        errorEl.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = "Connect";
      });
  });

  await loadKeys();
}

main().catch((err) => {
  document.getElementById("content").innerHTML =
    '<div class="message">Could not load integrations: ' + esc(err.message) + "</div>";
});
</script>
</body>
</html>
