<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/theme-init.js"></script>
<script src="/simulation.js"></script>
<link rel="stylesheet" href="/simulation.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>camaze — notifications</title>
<link rel="stylesheet" href="/shared.css">
<style>
  label.checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  label.checkbox-row input { cursor: pointer; }
  label.checkbox-row input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    width: 16px;
    height: 16px;
    margin: 0;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--page);
    position: relative;
  }
  label.checkbox-row input[type="checkbox"]:hover { border-color: var(--text-muted); }
  label.checkbox-row input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  label.checkbox-row input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 4px;
    top: 1px;
    width: 4px;
    height: 8px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  label.checkbox-row input[type="checkbox"]:disabled { opacity: 0.6; cursor: default; }
  .save-status { font-size: 12px; }
  .save-status.ok { color: var(--ok-fg); }
  .save-status.error { color: var(--danger); }

  .delivery-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    transition: opacity 0.15s;
  }
  .delivery-row.is-dimmed { opacity: 0.45; }
  .field-label { font-size: 12px; color: var(--text-muted); }
  .field-note { font-size: 12px; color: var(--text-muted); margin: 6px 0 0; }

  button, input, select {
    font: inherit;
    font-size: 13px;
  }
  select {
    padding: 7px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--page);
    color: var(--text-primary);
  }
  select:disabled { opacity: 0.55; cursor: not-allowed; }
  input[type="number"] {
    padding: 7px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--page);
    color: var(--text-primary);
  }
  input[type="number"]:disabled { opacity: 0.55; cursor: not-allowed; }

  .test-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .test-status { font-size: 13px; }
  .test-status.ok { color: var(--ok-fg); }
  .test-status.error { color: var(--danger); }
</style>
</head>
<body>
<header id="app-header"></header>
<main>
  <p class="subtitle">Choose how camaze keeps you posted</p>
  <div id="content"><div class="message">Loading&hellip;</div></div>
</main>

<script type="module" src="/pages/notifications.js"></script>
</body>
</html>
